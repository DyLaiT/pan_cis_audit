# CIS Palo Alto Benchmark — Section 2-6（進階：User-ID/HA/更新/WildFire/威脅防護）
# 務實原則（依官方 CIS↔TWGCB 對照 PDF 校準）：
#   - 能從 XML 靜態判的（設定存在性/排程/HA）→ 寫 XPath 自動判
#   - 官方標 Investigate(V) 的 profile 內容項 → 標 manual（需人工看 profile 細節，不硬做）
# XPath 移植自官方 PaloAltoNetworks/cis-benchmarks skillet。
checks:
  # ===== Section 2: User-ID（官方多標 Investigate，需人工）=====
  - id: "2.4"
    name: "User-ID Include/Exclude Networks"
    level: 2
    type: manual
    detail: "官方標 Investigate：若啟用 User-ID，需人工確認有設 Include/Exclude Networks（避免掃描外部）"

  - id: "2.5"
    name: "User-ID Agent 最小權限"
    level: 2
    type: manual
    detail: "官方標 Investigate：User-ID service account 權限需人工檢視（不應有互動登入/遠端存取）"

  # ===== Section 3: High Availability（可靜態判存在性）=====
  - id: "3.1"
    name: "HA 對等節點已設定"
    level: 2
    type: exists
    xpath: "/config/devices/entry/deviceconfig/high-availability/enabled"
    pass: "HA 已啟用"
    fail: "未設定 HA（單機無容錯；若為刻意單機部署可視為 N/A）"

  - id: "3.2"
    name: "HA Link/Path Monitoring"
    level: 2
    type: exists
    xpath: "/config/devices/entry/deviceconfig/high-availability/group/monitoring/link-monitoring"
    pass: "HA 已設 Link Monitoring"
    fail: "HA 未設 Link/Path Monitoring（故障偵測不足）"

  # ===== Section 4: Dynamic Updates（可靜態判排程存在）=====
  - id: "4.1"
    simple: true
    name: "Antivirus Update Schedule set to Hourly（防毒更新排程：每小時）"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/system/update-schedule/anti-virus/recurring"
    pass: "已設防毒更新排程"
    fail: "未設防毒更新排程（TWGCB-03-005-0030；病毒碼過期）"

  - id: "4.2"
    simple: true
    name: "Applications and Threats Update Schedule set to Daily（應用程式與威脅更新排程：每日）"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/system/update-schedule/threats/recurring"
    pass: "已設威脅更新排程"
    fail: "未設應用程式與威脅更新排程（TWGCB-03-005-0031）"

  - id: "5.7"
    name: "WildFire 更新排程"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/system/update-schedule/wildfire/recurring"
    pass: "已設 WildFire 更新排程"
    fail: "未設 WildFire 更新排程（TWGCB-03-005-0027）"

  # ===== Section 5: WildFire（profile 內容多需人工）=====
  - id: "5.3"
    name: "所有安全政策啟用 WildFire 分析"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認每條 allow 政策綁 WildFire 分析設定檔（TWGCB-03-005-0026）"

  # ===== Section 6: Threat Prevention profiles + Zone Protection =====
  # profile「內容是否安全」需人工看（官方 V）；profile/zone「是否存在」可靜態判
  - id: "6.16"
    name: "Zone Protection Profile 存在（SYN Flood）"
    level: 2
    type: exists
    xpath: "/config/devices/entry/network/profiles/zone-protection-profile/entry/@name"
    pass: "已定義 Zone Protection Profile"
    fail: "未定義任何 Zone Protection Profile（TWGCB-03-005-0021~0023；無 DoS/偵查防護）"

  # CIS 6.1 antivirus profiles set to reset-both — 靜態可判：AV profile 存在即為前提，
  # decoder 動作是否全 reset-both 需逐 decoder 看，此處判「有無自訂 AV profile」，
  # 內容細節（每 decoder action）標於 fail 提示人工複核。
  - id: "6.1"
    simple: true
    name: "Antivirus profiles set to reset-both"
    level: 1
    type: exists
    xpath: "/config/devices/entry/vsys/entry/profiles/virus/entry/@name"
    pass: "已定義自訂 antivirus profile（請確認各 decoder 動作為 reset-both）"
    fail: "未定義自訂 antivirus profile（僅用預設，decoder 動作未強制 reset-both）"

  - id: "6.2"
    simple: true
    name: "Secure antivirus profile applied to security policies"
    level: 2
    type: exists
    xpath: "/config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/profiles/virus/member | /config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/group/member"
    pass: "安全政策已綁定 antivirus profile（或 profile group）"
    fail: "無任何安全政策綁定 antivirus profile —— 流量未經防毒檢查"

  - id: "6.3"
    simple: true
    name: "Anti-spyware profile configured to block"
    level: 1
    type: exists
    xpath: "/config/devices/entry/vsys/entry/profiles/spyware/entry/@name"
    pass: "已定義自訂 anti-spyware profile（請確認嚴重性規則動作為 block/reset）"
    fail: "未定義自訂 anti-spyware profile（僅用預設，未強制 block）"

  # CIS 6.6 Vulnerability Protection Profile set to block（注意：此為 NICS/新版 CIS 編號，
  # 舊版此號為 anti-spyware policy binding，勿混淆）
  - id: "6.6"
    simple: true
    name: "Vulnerability Protection Profile set to block"
    level: 1
    type: exists
    xpath: "/config/devices/entry/vsys/entry/profiles/vulnerability/entry/@name"
    pass: "已定義自訂 vulnerability protection profile（請確認 critical/high 動作為 block/reset）"
    fail: "未定義自訂 vulnerability protection profile（僅用預設，未強制 block）"

  - id: "6.7"
    simple: true
    name: "Secure Vulnerability Protection Profile applied"
    level: 1
    type: exists
    xpath: "/config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/profiles/vulnerability/member | /config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/group/member"
    pass: "安全政策已綁定 vulnerability protection profile（或 profile group）"
    fail: "無任何安全政策綁定 vulnerability protection profile —— 漏洞攻擊未被阻擋"

  # CIS 6.11 all HTTP Header Logging options enabled
  - id: "6.11"
    simple: true
    name: "All HTTP Header Logging options enabled"
    level: 2
    type: exists
    xpath: "/config/devices/entry/vsys/entry/profiles/url-filtering/entry/log-http-hdr-xff | /config/devices/entry/vsys/entry/profiles/url-filtering/entry/log-http-hdr-user-agent | /config/devices/entry/vsys/entry/profiles/url-filtering/entry/log-http-hdr-referer"
    pass: "URL filtering profile 已啟用 HTTP header logging（XFF/User-Agent/Referer）"
    fail: "URL filtering profile 未啟用 HTTP header logging 選項（TWGCB-03-005-0041）"

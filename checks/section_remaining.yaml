# CIS Palo Alto Benchmark — 補齊剩餘 37 項（達完整 71 項）
# 校準原則（依官方 CIS↔TWGCB 對照）：能從 XML 靜態判的寫 XPath；profile 內容/政策綁定/
# User-ID/decryption 等官方標 Investigate 者標 manual（需人工看內容，不硬判）。
checks:
  # ---- Section 1 補 ----
  - id: "1.1.1.2"
    name: "SNMPv3 traps 已設定"
    level: 1
    type: exists
    xpath: "/config/shared/log-settings/snmptrap/entry/version/v3"
    pass: "SNMPv3 trap 已設定"
    fail: "未設定 SNMPv3 traps（或用 v1/v2c 明文）"
  - id: "1.2.2"
    simple: true
    name: "Ensure Permitted IP Addresses is set for all management profiles（管理設定檔 Permitted IP）"
    level: 1
    type: exists
    xpath: "/config/devices/entry/network/profiles/interface-management-profile/entry/permitted-ip/entry/@name"
    pass: "介面管理設定檔已限制來源 IP"
    fail: "介面管理設定檔未設 Permitted IP"
  - id: "1.2.4"
    simple: true
    name: "Ensure HTTP and Telnet options are disabled for all management profiles（管理設定檔停用 HTTP/Telnet）"
    level: 1
    type: manual
    detail: "需人工確認所有 interface-management-profile 的 http/telnet 未啟用"
  - id: "1.6.1"
    simple: true
    name: "Ensure Verify Update Server Identity is enabled（驗證更新伺服器身分）"
    level: 1
    type: equals
    xpath: "/config/devices/entry/deviceconfig/system/server-verification/text()"
    expected: "yes"
    fail_missing: "未設定驗證更新伺服器身分（TWGCB-03-005-0019）"
  - id: "1.6.3"
    name: "遠端存取 VPN 憑證有效"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認 VPN 憑證有效非自簽過期"

  # ---- Section 2 User-ID（官方多標 Investigate，全人工）----
  - id: "2.1"
    name: "IP 對應使用者名稱"
    level: 2
    type: manual
    detail: "官方標 Investigate：User-ID 的 IP-user 對應需人工確認"
  - id: "2.2"
    name: "停用 WMI probing"
    level: 2
    type: manual
    detail: "官方標 Investigate：確認 User-ID 未啟用 WMI probing（易被濫用）"
  - id: "2.3"
    name: "User-ID 僅內部信任介面"
    level: 2
    type: manual
    detail: "需人工確認 User-ID 只在內部信任 zone 啟用"
  - id: "2.6"
    name: "User-ID 服務帳號無互動登入"
    level: 2
    type: manual
    detail: "官方標 Investigate：需查 AD 端 User-ID service account 權限（XML 無此資訊）"
  - id: "2.7"
    name: "User-ID 帳號禁遠端存取"
    level: 2
    type: manual
    detail: "官方標 Investigate：需查 User-ID service account 遠端存取權（AD 端）"
  - id: "2.8"
    name: "安全政策限制 User-ID Agent 流量"
    level: 2
    type: manual
    detail: "需人工確認政策限制 User-ID Agent 不跨入不信任 zone"

  # ---- Section 3 HA 補 ----
  - id: "3.3"
    name: "HA Passive Link State / Preemptive"
    level: 2
    type: manual
    detail: "需人工確認 HA passive-link-state=auto、preemptive 設定適當"

  # ---- Section 5 WildFire 補（多內容項，人工）----
  - id: "5.1"
    name: "WildFire 檔案大小上限最大化"
    level: 2
    type: manual
    detail: "官方標 Investigate：需比對 WildFire file-size 各類型是否設到建議上限"
  # CIS 5.2 WildFire Analysis profile enabled for all security policies
  - id: "5.2"
    simple: true
    name: "Ensure a WildFire Analysis profile is enabled for all security policies"
    level: 2
    type: exists
    xpath: "/config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/profiles/wildfire-analysis/member | /config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/group/member"
    pass: "安全政策已綁定 WildFire Analysis profile（或 profile group）"
    fail: "無任何安全政策綁定 WildFire Analysis profile —— 未知檔案未送 WildFire 分析"
  - id: "5.4"
    name: "解密內容轉送 WildFire"
    level: 2
    type: exists
    xpath: "/config/devices/entry/deviceconfig/setting/wildfire/report-grayware-file"
    pass: "WildFire 相關設定存在"
    fail: "未設定解密內容轉送 WildFire（需確認）"
  - id: "5.5"
    name: "WildFire session 資訊全啟用"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認 WildFire session-information 各項啟用"
  # CIS 5.6 WildFire Update Schedule set to Real-time（real-time 為空元素，存在即啟用）
  - id: "5.6"
    simple: true
    name: "Ensure WildFire Update Schedule is set to Real-time"
    level: 2
    type: exists
    xpath: "/config/devices/entry/deviceconfig/system/update-schedule/wildfire/recurring/real-time"
    pass: "WildFire 更新排程設為 real-time"
    fail: "WildFire 更新排程未設為 real-time（非即時更新，威脅情資延遲）"

  # ---- Section 6 威脅防護補（內容項多人工）----
  # CIS 6.4 DNS sinkholing configured on anti-spyware profiles
  - id: "6.4"
    simple: true
    name: "Ensure DNS sinkholing is configured on anti-spyware profiles"
    level: 1
    type: exists
    xpath: "/config/devices/entry/vsys/entry/profiles/spyware/entry/botnet-domains/sinkhole/ipv4-address | /config/devices/entry/vsys/entry/profiles/spyware/entry/botnet-domains/sinkhole/ipv6-address"
    pass: "anti-spyware profile 已設定 DNS sinkhole IP"
    fail: "anti-spyware profile 未設定 DNS sinkholing（TWGCB-03-005-0035）"
  # CIS 6.5 secure anti-spyware profile applied
  - id: "6.5"
    simple: true
    name: "Ensure a secure anti-spyware profile is applied"
    level: 2
    type: exists
    xpath: "/config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/profiles/spyware/member | /config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/group/member"
    pass: "安全政策已綁定 anti-spyware profile（或 profile group）"
    fail: "無任何安全政策綁定 anti-spyware profile —— 間諜軟體/C2 未被偵測"
  # 舊版 6.6（anti-spyware policy binding）已由新版 6.5 涵蓋；新版 6.6 = Vulnerability
  # Protection set to block，定義於 section2to6_advanced.yaml。此處不重複標 simple。
  - id: "6.6-legacy"
    name: "（舊編號）對外政策套用反間諜設定檔"
    level: 2
    type: manual
    detail: "此為舊版 CIS 6.6，新版對應 6.5（secure anti-spyware applied）；保留供對照，不列入 --simple"
  - id: "6.8"
    name: "所有政策套用漏洞保護設定檔"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認每條政策綁安全 vulnerability profile（TWGCB-03-005-0038）"
  - id: "6.9"
    name: "使用 PAN-DB URL Filtering"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認 URL filtering 用 PAN-DB"
  - id: "6.10"
    name: "URL 過濾 block/override 分類"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認 URL 分類動作為 block/override"
  # CIS 6.12 secure URL filtering enabled（政策綁 URL filtering profile）
  - id: "6.12"
    simple: true
    name: "Ensure secure URL filtering is enabled"
    level: 2
    type: exists
    xpath: "/config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/profiles/url-filtering/member | /config/devices/entry/vsys/entry/rulebase/security/rules/entry/profile-setting/group/member"
    pass: "安全政策已綁定 URL filtering profile（或 profile group）"
    fail: "無任何安全政策綁定 URL filtering profile —— 惡意/不當網址未被過濾"
  - id: "6.13"
    name: "對外政策啟用安全 URL 過濾"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認對網際網路政策綁 URL filtering（TWGCB-03-005-0043）"
  - id: "6.14"
    name: "信用卡/SSN 門檻告警"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認 Data Filtering 信用卡/SSN 告警門檻"
  # CIS 6.15 SYN Flood Action of SYN Cookies attached（zone protection 的 tcp-syn 動作為 syn-cookies）
  - id: "6.15"
    simple: true
    name: "Ensure SYN Flood Action of SYN Cookies is attached"
    level: 2
    type: exists
    xpath: "/config/devices/entry/network/profiles/zone-protection-profile/entry/flood/tcp-syn/syn-cookies"
    pass: "Zone Protection 的 SYN Flood 動作設為 SYN Cookies"
    fail: "SYN Flood 動作未設為 SYN Cookies（多為 RED；SYN Cookies 較能抗偽造來源 SYN 洪水）"
  # CIS 6.17 zones have Zone Protection Profiles with Reconnaissance Protection
  - id: "6.17"
    simple: true
    name: "Ensure zones have Zone Protection Profiles with Reconnaissance Protection"
    level: 2
    type: exists
    xpath: "/config/devices/entry/network/profiles/zone-protection-profile/entry/scan/entry"
    pass: "Zone Protection Profile 已設定 Reconnaissance Protection（scan）"
    fail: "Zone Protection Profile 未設定偵查保護（port/host scan 偵測，TWGCB-03-005-0022）"
  # CIS 6.18 zones have Zone Protection Profiles that drop specially crafted packets
  - id: "6.18"
    simple: true
    name: "Ensure all zones have Zone Protection Profiles that drop specially crafted packets"
    level: 2
    type: exists
    xpath: "/config/devices/entry/network/profiles/zone-protection-profile/entry/packet-based-attack-protection"
    pass: "Zone Protection Profile 已設定丟棄異常封包（packet-based-attack-protection）"
    fail: "Zone Protection Profile 未設定丟棄特製異常封包（TWGCB-03-005-0023）"
  - id: "6.19"
    name: "Zone Protection 丟棄異常封包"
    level: 2
    type: manual
    detail: "需人工確認所有 zone 啟用 packet-based attack protection（TWGCB-03-005-0023）"
  - id: "6.20"
    name: "使用者憑證提交 block/continue"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認 URL filtering 的 credential submission 動作"

  # ---- Section 7 安全政策 ----
  - id: "7.1"
    name: "允許政策有 application 管制"
    level: 2
    type: manual
    detail: "需人工/交叉 pan_audit：allow 政策應限定 application（非 any）"
  # CIS 7.2 Service setting of ANY in a security policy does not exist
  # absent：允許(allow)政策中 service=any 者不應存在。命中即 FAIL（過度寬鬆）。
  - id: "7.2"
    simple: true
    name: "Ensure Service setting of ANY in a security policy does not exist"
    level: 2
    type: absent
    xpath: "/config/devices/entry/vsys/entry/rulebase/security/rules/entry[action='allow']/service/member[text()='any']"
    pass: "無 allow 政策使用 service=any"
    fail: "存在 allow 政策 service=any（過度寬鬆，未限定服務埠；TWGCB-03-005-0024）"
  - id: "7.3"
    name: "有拒絕惡意 IP 的政策"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認有 deny 已知惡意 IP 的政策"

  # ---- Section 8 Decryption（全需人工）----
  - id: "8.1"
    name: "SSL Forward Proxy 政策"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認對外流量有 SSL Forward Proxy 解密政策"
  - id: "8.2"
    name: "SSL Inbound Inspection"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認對內部伺服器有 SSL Inbound Inspection"
  - id: "8.3"
    name: "解密憑證有效"
    level: 2
    type: manual
    detail: "官方標 Investigate：需人工確認解密用憑證有效"

  # ---- 7.4 補（built-in default security policy logging）----
  - id: "7.4"
    simple: true
    name: "Ensure that logging is enabled on built-in default security policies（內建預設政策啟用記錄）"
    level: 2
    type: exists
    xpath: "/config/devices/entry/vsys/entry/rulebase/default-security-rules/rules/entry[@name='interzone-default']/log-end[text()='yes'] | /config/devices/entry/vsys/entry/rulebase/default-security-rules/rules/entry/log-setting"
    pass: "內建預設政策(interzone/intrazone-default)已啟用記錄"
    fail: "內建預設政策未啟用記錄（log-end/log-setting）——被 default 規則處理的流量無日誌（TWGCB-03-005-0025 相關）"

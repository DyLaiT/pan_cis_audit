# CIS Palo Alto Firewall Benchmark — Section 1: Device Setup
# XPath 移植自官方 PaloAltoNetworks/cis-benchmarks skillet（MIT）
# 離線 XML 版；PAN-OS 10.x 相容
checks:
  - id: "1.1.1.1"
    name: "Syslog logging 已設定"
    level: 1
    type: exists
    xpath: "/config/shared/log-settings/system/match-list/entry[send-syslog]/@name"
    pass: "system log 已設 syslog 轉送"
    fail: "未設定 syslog 日誌轉送（無法外送稽核日誌）"

  - id: "1.1.2"
    name: "登入警語 (Login Banner)"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/system/login-banner"
    pass: "已設定登入警語"
    fail: "未設定登入警語（CIS L1 要求）"

  - id: "1.1.3"
    simple: true
    name: "Enable Log on High DP Load is enabled"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/setting/management/enable-log-high-dp-load"
    pass: "已啟用高負載記錄"
    fail: "未啟用 Log on High DP Load"

  - id: "1.2.1"
    simple: true
    name: "管理介面 Permitted IP"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/system/permitted-ip/entry/@name"
    pass: "管理介面已限制來源 IP"
    fail: "管理介面未設 Permitted IP（任意來源可管理）"

  - id: "1.2.3"
    simple: true
    name: "管理介面停用 HTTP/Telnet"
    level: 1
    type: manual
    detail: "確認 deviceconfig/system/service 的 disable-http/disable-telnet=yes（見 pan_audit 2.1）"

  - id: "1.2.5"
    name: "管理介面有效憑證"
    level: 2
    type: exists
    xpath: "/config/shared/ssl-tls-service-profile/entry/@name"
    pass: "已設 SSL/TLS service profile"
    fail: "管理介面未設有效憑證 profile（用預設自簽）"

  - id: "1.3.1"
    simple: true
    name: "密碼複雜度已啟用"
    level: 1
    type: equals
    xpath: "/config/mgt-config/password-complexity/enabled/text()"
    expected: "yes"
    fail_missing: "未設定密碼複雜度"
    fail: "密碼複雜度未啟用"

  - id: "1.3.2"
    simple: true
    name: "密碼最短長度 ≥12"
    level: 1
    type: min
    xpath: "/config/mgt-config/password-complexity/minimum-length/text()"
    threshold: 12
    fail_missing: "未設定最短長度"

  - id: "1.3.3"
    simple: true
    name: "密碼最少大寫 ≥1"
    level: 1
    type: min
    xpath: "/config/mgt-config/password-complexity/minimum-uppercase-letters/text()"
    threshold: 1
    fail_missing: "未設定大寫要求"

  - id: "1.3.4"
    simple: true
    name: "密碼最少小寫 ≥1"
    level: 1
    type: min
    xpath: "/config/mgt-config/password-complexity/minimum-lowercase-letters/text()"
    threshold: 1
    fail_missing: "未設定小寫要求"

  - id: "1.3.5"
    simple: true
    name: "密碼最少數字 ≥1"
    level: 1
    type: min
    xpath: "/config/mgt-config/password-complexity/minimum-numeric-letters/text()"
    threshold: 1
    fail_missing: "未設定數字要求"

  - id: "1.3.6"
    simple: true
    name: "密碼最少特殊字元 ≥1"
    level: 1
    type: min
    xpath: "/config/mgt-config/password-complexity/minimum-special-characters/text()"
    threshold: 1
    fail_missing: "未設定特殊字元要求"

  - id: "1.3.7"
    simple: true
    name: "密碼變更週期 ≤90 天"
    level: 1
    type: max
    xpath: "/config/mgt-config/password-complexity/password-change/expiration-period/text()"
    threshold: 90
    fail_missing: "未設定密碼變更週期"

  - id: "1.3.8"
    simple: true
    name: "新密碼差異字元 ≥3"
    level: 1
    type: min
    xpath: "/config/mgt-config/password-complexity/new-password-differs-by-characters/text()"
    threshold: 3
    fail_missing: "未設定新密碼差異要求"

  - id: "1.3.9"
    name: "密碼重用限制 ≥24"
    level: 1
    type: min
    xpath: "/config/mgt-config/password-complexity/password-history-count/text()"
    threshold: 24
    fail_missing: "未設定密碼重用限制"

  - id: "1.3.10"
    simple: true
    name: "Password Profiles 不存在"
    level: 1
    type: absent
    xpath: "/config/mgt-config/password-profile/entry/@name"
    pass: "無 password-profile（不會繞過複雜度原則）"
    fail: "存在 password-profile（可能繞過全域密碼原則）"

  - id: "1.4.1"
    simple: true
    name: "管理閒置逾時 ≤10 分鐘"
    level: 1
    type: max
    xpath: "/config/devices/entry/deviceconfig/setting/management/idle-timeout/text()"
    threshold: 10
    fail_missing: "未設定閒置逾時"

  - id: "1.4.2"
    simple: true
    name: "帳號鎖定（失敗次數/鎖定時間）"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/setting/management/admin-lockout/failed-attempts"
    pass: "已設定帳號鎖定"
    fail: "未設定帳號鎖定（admin-lockout），無暴力破解防護"

  - id: "1.5.1"
    name: "SNMP 使用 V3"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/system/snmp-setting/access-setting/version/v3"
    pass: "SNMP 使用 v3（加密認證）"
    fail: "SNMP 未使用 v3（v1/v2c 為明文）"

  - id: "1.6.2"
    simple: true
    name: "NTP 冗餘（primary + secondary）"
    level: 1
    type: exists
    xpath: "/config/devices/entry/deviceconfig/system/ntp-servers/secondary-ntp-server/ntp-server-address"
    pass: "已設 secondary NTP（冗餘）"
    fail: "未設 secondary NTP（單一 NTP 無冗餘）"
